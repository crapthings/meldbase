name: SDK beta release

on:
  workflow_dispatch:
    inputs:
      verify_oidc_only:
        description: "Verify trusted publishing for all packages without publishing a version"
        type: boolean
        default: false
      prepare_only:
        description: "Build verified beta tarballs without publishing to npm"
        type: boolean
        default: false
      bootstrap:
        description: "Use the configured bootstrap credential for first npm publication"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: sdk-beta-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    name: Publish npm beta packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify publication authentication
        env:
          NODE_AUTH_TOKEN: ${{ inputs.bootstrap && secrets.NPM_BOOTSTRAP_TOKEN || '' }}
          BOOTSTRAP: ${{ inputs.bootstrap }}
          VERIFY_OIDC_ONLY: ${{ inputs.verify_oidc_only }}
        run: |
          if [ "$VERIFY_OIDC_ONLY" = "true" ] && [ "$BOOTSTRAP" = "true" ]; then
            echo "OIDC verification cannot use bootstrap authentication."
            exit 1
          fi
          if [ "$BOOTSTRAP" = "true" ] && [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "Bootstrap publication requires repository secret NPM_BOOTSTRAP_TOKEN."
            exit 1
          fi
          node --version
          npm --version
      - name: Verify package trusted publishers without bootstrap credentials
        if: inputs.verify_oidc_only
        run: node scripts/verify-npm-oidc.mjs
      - name: Install locked dependencies
        if: ${{ !inputs.verify_oidc_only }}
        run: pnpm install --frozen-lockfile
      - name: Re-run beta quality and documentation gates
        if: ${{ !inputs.verify_oidc_only }}
        run: |
          pnpm quality:sdk
          pnpm docs:build
      - name: Verify and publish beta tarballs with npm provenance
        if: ${{ !inputs.verify_oidc_only }}
        env:
          NODE_AUTH_TOKEN: ${{ inputs.bootstrap && secrets.NPM_BOOTSTRAP_TOKEN || '' }}
          MELDBASE_SDK_PACK_DIR: ${{ runner.temp }}/meldbase-sdk-beta
        run: |
          if [ "${{ inputs.prepare_only }}" = "true" ]; then
            pnpm release:sdk:beta --pack-only
          else
            pnpm release:sdk:beta
          fi
      - name: Retain verified beta tarballs and source receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: meldbase-sdk-beta
          path: ${{ runner.temp }}/meldbase-sdk-beta
          if-no-files-found: ignore
